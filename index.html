      // Diagnostic guard if GitHub Pages is accidentally serving raw unbuilt source instead of GitHub Actions
      window.addEventListener('load', function () {
        setTimeout(function () {

          var rawTsxScript = document.querySelector('script[src*="src/main.tsx"]');

              '<p style="color:#a4a39d;line-height:1.6;margin:0 0 16px;font-size:15px;">GitHub Pages is currently serving raw TypeScript source files instead of the built bundle. To make your site live:</p>' +
              '<ol style="color:#ecebe6;line-height:1.75;padding-left:20px;margin:0;font-size:14px;">' +
              '<li>Open your GitHub repository <strong>Settings → Pages</strong>.</li>' +
              '<li>Under <strong>Build and deployment → Source</strong>, select <strong>GitHub Actions</strong>.</li>' +
              '<li>Ensure the <code>.github/workflows/deploy.yml</code> file is uploaded in your repository, then refresh in ~60 seconds.</li>' +
              '</ol>' +
              '</div></div>';
          }
        }, 2000);
      });
